<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff69b4">

  <title>✨ Cute PUB Bill Splitter ✨</title>
</head>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    margin-top: 10%;
    padding: 0;
    font-size: 20px;
    font-family: 'Times New Roman', Times, serif;
    background-color: #fff0f5;
    width: 100vw;
    overflow-x: hidden;
  }

  body {
    padding: 16px;
    color: #333;
  }

  h1 {
    text-align: center;
    color: #ff69b4;
    font-size: 2rem;
    margin-bottom: 1.5rem;
  }

  label {
    display: block;
    margin-top: 1.2rem;
    font-size: 1.2rem;
  }

  input, button {
    padding: 1rem;
    font-size: 1.2rem;
    border: 2px solid #ffb6c1;
    border-radius: 10px;
    width: 100%;
    margin-top: 0.3rem;
  }

  button {
    background-color: #ff69b4;
    color: white;
    font-weight: bold;
    margin-top: 1.5rem;
  }

  .person-inputs {
    margin-top: 1.5rem;
  }

  .results {
    margin-top: 2rem;
    background: #ffe4e1;
    padding: 1rem;
    border-radius: 10px;
    font-size: 1.2rem;
  }
</style>
<body>
  <h1>🐥 Cute PUB Bill Splitter 🧁</h1>

  <label>Total PUB Bill ($)</label>
  <input type="number" id="totalBill" placeholder="e.g. 120.50" step="0.01">

  <label>Number of Days in the Month</label>
  <input type="number" id="daysInMonth" placeholder="e.g. 30">

  <label>Number of People in the House</label>
  <input type="number" id="numPeople" placeholder="e.g. 6" oninput="generatePersonInputs()">

  <div class="person-inputs" id="personInputs"></div>

  <button onclick="calculateFees()">Calculate Fees 💸</button>

  <div class="results" id="results"></div>

  <script>
    function generatePersonInputs() {
      const numPeople = parseInt(document.getElementById('numPeople').value);
      const container = document.getElementById('personInputs');
      container.innerHTML = '';
      for (let i = 0; i < numPeople; i++) {
        const label = document.createElement('label');
        label.innerText = `Days Person ${i + 1} Stayed`;
        const input = document.createElement('input');
        input.type = 'number';
        input.min = 0;
        input.placeholder = 'e.g. 30';
        input.id = `person_${i}`;
        container.appendChild(label);
        container.appendChild(input);
      }
    }

    function calculateFees() {
      const totalBill = parseFloat(document.getElementById('totalBill').value);
      const numPeople = parseInt(document.getElementById('numPeople').value);
      const daysInMonth = parseInt(document.getElementById('daysInMonth').value);
      const stayDays = [];
      let totalPersonDays = 0;

      for (let i = 0; i < numPeople; i++) {
        const days = parseInt(document.getElementById(`person_${i}`).value) || 0;
        stayDays.push(days);
        totalPersonDays += days;
      }

      let resultHTML = `<h3>💡 Split Results:</h3>`;
      for (let i = 0; i < numPeople; i++) {
        const personFee = ((stayDays[i] / totalPersonDays) * totalBill).toFixed(2);
        resultHTML += `👤 Person ${i + 1}: $${personFee} <br>`;
      }

      document.getElementById('results').innerHTML = resultHTML;
    }

    if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('Service Worker registered!'));
  }
  </script>
</body>

</html>
